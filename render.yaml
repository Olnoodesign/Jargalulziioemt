# Render.com дээр GitHub repo-гоос "Blueprint" болгон deploy хийх тохиргоо.
# Render дээр: New → Blueprint → өөрийн GitHub repo-гоо сонгоно.
services:
  - type: web
    name: jargal-ulzii
    runtime: node
    plan: starter            # Байнгын диск ашиглахын тулд төлбөртэй instance хэрэгтэй.
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true  # Render автоматаар хүчтэй нууц түлхүүр үүсгэнэ
      - key: DATA_DIR
        value: /data
    disk:
      name: data             # SQLite файл энд хадгалагдаж, дахин deploy-д устахгүй
      mountPath: /data
      sizeGB: 1
